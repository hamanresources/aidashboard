<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>함안자원 김해공장 AI 데이터 자동화</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700&family=Noto+Serif+KR:wght@400;600&display=swap">
<style>
:root {
  --color-bg: #f6f7f9; --color-panel: #ffffff; --color-fg: #1b1f27; --color-fg-muted: #5d6573;
  --color-border-line: #dfe3ea; --color-ok: #1f7a4d; --color-warn: #a35a00; --color-bad: #c0392b;
  --cds-chart-grid: #eceff4; --cds-chart-axis: #b9c0cc; --cds-chart-reference: #8a93a3; --cds-chart-muted: #9aa3b2;
  --cds-surface-popover: #ffffff; --cds-border: #dfe3ea; --cds-shadow-popover: 0 6px 20px rgba(20,30,50,.12); --cds-text-secondary: #5d6573;
  --cds-radius: 10px; --cds-gap-xs: 4px; --cds-gap-sm: 8px; --cds-gap-md: 14px; --cds-gap-lg: 22px; --cds-gap-xl: 32px;
  --cds-pad-xs: 4px; --cds-pad-sm: 8px; --cds-pad-md: 14px; --cds-pad-lg: 20px; --cds-pad-xl: 28px;
  --cds-font-size-caption: 12.5px; --cds-font-size-body: 14.5px; --cds-font-size-heading: 17px; --cds-font-size-title: 30px;
  --cds-font-weight-medium: 600; --cds-dur-slow: .3s; --cds-ease-out: cubic-bezier(.2,.7,.2,1);
  --font-anthropic-sans: "Noto Sans KR", "Malgun Gothic", "Apple SD Gothic Neo", system-ui, sans-serif;
  --font-anthropic-serif: "Noto Serif KR", "Batang", Georgia, serif;
  --dash-gutter: clamp(16px, 4vw, 40px);
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root {
    --color-bg: #12151b; --color-panel: #1a1e26; --color-fg: #e8ebf0; --color-fg-muted: #a3abb8;
    --color-border-line: #2c323d; --color-ok: #4cc38a; --color-warn: #e0a24a; --color-bad: #ef6b5b;
    --cds-chart-grid: #232833; --cds-chart-axis: #3a4250; --cds-chart-reference: #6d7686; --cds-chart-muted: #6d7686;
    --cds-surface-popover: #222733; --cds-border: #333a47; --cds-shadow-popover: 0 6px 20px rgba(0,0,0,.4); --cds-text-secondary: #a3abb8;
    color-scheme: dark;
  }
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--color-bg); color: var(--color-fg); font-family: var(--font-anthropic-sans); font-size: var(--cds-font-size-body); }
#dash-root { max-width: 1400px; margin: 0 auto; padding: 24px var(--dash-gutter) 48px; }
.snap { max-width: 1400px; margin: 0 auto; padding: 10px var(--dash-gutter) 0; color: var(--color-fg-muted); font-size: 12px; }
.dash-skeleton { color: transparent !important; background: var(--cds-chart-grid); border-radius: 6px; }
a { color: inherit; }
[hidden] { display: none !important; }


.hw { display: grid; gap: var(--cds-gap-lg); font-family: var(--font-anthropic-sans); font-variant-numeric: tabular-nums; word-break: keep-all; overflow-wrap: break-word; }
.hw-head { display: flex; flex-direction: column; gap: var(--cds-gap-md); align-items: flex-start; }
.hw-head:empty { display: none; }
#item-filter { flex-wrap: wrap; max-width: 100%; width: fit-content; justify-self: start; }
.hw-head h1 { margin: 0; font-family: var(--font-anthropic-serif); font-weight: 400; font-size: var(--cds-font-size-title); text-wrap: balance; }
.hw-eyebrow { color: var(--color-fg-muted); font-size: var(--cds-font-size-caption); letter-spacing: .04em; margin-bottom: var(--cds-gap-xs); }
.hw-take { margin: var(--cds-gap-xs) 0 0; color: var(--color-fg-muted); max-width: 62ch; }
.hw-take b { color: var(--color-fg); font-weight: 600; }
.hw-seg { --seg-bg: #e6e9ee; --seg-line: #cfd4dc; display: inline-flex; background: var(--seg-bg); border: 1px solid var(--seg-line); border-radius: var(--cds-radius); overflow: hidden; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .hw-seg { --seg-bg: #2a303b; --seg-line: #3a4250; } }
:root[data-theme="dark"] .hw-seg { --seg-bg: #2a303b; --seg-line: #3a4250; }
.hw-seg button { font: inherit; border: 0; background: transparent; color: var(--color-fg); padding: var(--cds-pad-xs) var(--cds-pad-md); cursor: pointer; }
.hw-seg button + button { border-left: 1px solid var(--seg-line); }
.hw-seg button[aria-pressed="true"] { background: var(--color-panel); color: var(--color-fg); font-weight: 700; box-shadow: inset 0 -2px 0 var(--color-fg); }
.hw-seg button:hover:not([aria-pressed="true"]) { background: rgba(0,0,0,.05); }
.hw-seg button:focus-visible { outline: 2px solid var(--color-fg); outline-offset: -2px; }
.hw-kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 11rem), 1fr)); gap: var(--cds-gap-md); }
.hw-kpi { background: var(--color-panel); border: 1px solid var(--color-border-line); border-radius: var(--cds-radius); padding: var(--cds-pad-md) var(--cds-pad-lg); display: grid; gap: var(--cds-gap-xs); align-content: start; }
.hw-kpi .lbl { color: var(--color-fg-muted); font-size: var(--cds-font-size-caption); }
.hw-kpi .val { font-family: var(--font-anthropic-serif); font-weight: 400; font-size: var(--cds-font-size-title); line-height: 1.1; }
.hw-kpi .unit { font-size: var(--cds-font-size-body); color: var(--color-fg-muted); margin-left: .2em; font-family: var(--font-anthropic-sans); }
.hw-kpi .sub { color: var(--color-fg-muted); font-size: var(--cds-font-size-caption); }
.hw-memo { grid-column: span 2; }
@media (max-width: 560px) { .hw-memo { grid-column: 1 / -1; } }
.memo-text { margin: 0; font-size: var(--cds-font-size-body); line-height: 1.55; text-wrap: pretty; }
.hw-prices { list-style: none; margin: 0; padding: 0; display: flex; flex-wrap: wrap; gap: var(--cds-gap-sm); }
.hw-prices li { display: inline-flex; gap: 8px; align-items: baseline; padding: var(--cds-pad-xs) var(--cds-pad-sm); border: 1px solid var(--color-border-line); border-radius: var(--cds-radius); background: var(--color-bg); }
.hw-prices .pd { color: var(--color-fg-muted); font-size: var(--cds-font-size-caption); }
.hw-prices .pc { font-weight: 600; color: var(--color-bad); }
.hw-prices .pc.up { color: var(--color-ok); }
.hw-tabs { display: flex; gap: var(--cds-gap-xs); border-bottom: 1px solid var(--color-border-line); }
.hw-tabs button { font: inherit; background: transparent; border: 0; border-bottom: 2px solid transparent; color: var(--color-fg-muted); padding: var(--cds-pad-sm) var(--cds-pad-md); margin-bottom: -1px; cursor: pointer; }
.hw-tabs button[aria-selected="true"] { color: var(--color-fg); border-bottom-color: var(--color-fg); font-weight: 600; }
.hw-tabs button:focus-visible { outline: 2px solid var(--color-fg); outline-offset: -2px; }
.hw-tab { display: grid; gap: var(--cds-gap-lg); }
.rp-head { display: grid; gap: var(--cds-gap-xs); }
.rp-head h2 { margin: 0; font-family: var(--font-anthropic-serif); font-weight: 400; font-size: var(--cds-font-size-title); }
.rp-list { list-style: none; margin: 0; padding: 0; display: grid; gap: var(--cds-gap-md); }
.rp-item { display: grid; gap: 4px; padding-left: var(--cds-pad-md); border-left: 3px solid var(--color-border-line); }
.rp-item[data-level="주의"] { border-left-color: var(--color-bad); }
.rp-item[data-level="확인"] { border-left-color: var(--color-warn); }
.rp-item[data-level="양호"] { border-left-color: var(--color-ok); }
.rp-item .rp-t { display: flex; flex-wrap: wrap; gap: var(--cds-gap-sm); align-items: center; font-weight: 600; }
.rp-item .rp-b { margin: 0; color: var(--color-fg); line-height: 1.6; max-width: 72ch; text-wrap: pretty; }
.rp-lv { font-size: var(--cds-font-size-caption); font-weight: 600; padding: 0 8px; border-radius: 999px; border: 1px solid currentColor; }
.rp-lv[data-level="주의"] { color: var(--color-bad); }
.rp-lv[data-level="확인"] { color: var(--color-warn); }
.rp-lv[data-level="양호"] { color: var(--color-ok); }
.rp-lv[data-level="참고"] { color: var(--color-fg-muted); }
.hw-table td.dn { color: var(--color-bad); }
.hw-table td.up { color: var(--color-ok); }
.rp-tables { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 22rem), 1fr)); gap: var(--cds-gap-lg); align-items: start; }
.hw-tablescroll { overflow-x: auto; min-width: 0; }
.rp-table { font-size: var(--cds-font-size-body); }
.rp-table th { position: static; }
.rp-table th.grp { text-align: center; border-bottom: 1px solid var(--color-border-line); }
.rp-table td, .rp-table th { padding: var(--cds-pad-sm); }
.rp-table tr.sum td { font-weight: 600; border-top: 2px solid var(--color-border-line); }
.rp-stance { margin: 0; padding-left: 1.4em; display: grid; gap: var(--cds-gap-md); }
.rp-stance .rp-st-t { font-weight: 600; }
.rp-news { list-style: none; margin: 0; padding: 0; display: grid; gap: var(--cds-gap-md); max-height: 640px; overflow: auto; }
.rp-news li { display: grid; gap: 2px; padding-bottom: var(--cds-gap-md); border-bottom: 1px solid var(--color-border-line); }
.rp-news li:last-child { border-bottom: 0; }
.rp-n-meta { color: var(--color-fg-muted); font-size: var(--cds-font-size-caption); }
.rp-n-t { font-weight: 600; color: var(--color-fg); }
a.rp-n-t { text-decoration: underline; text-underline-offset: 3px; text-decoration-color: var(--color-border-line); }
a.rp-n-t:hover { text-decoration-color: currentColor; }
.rp-ok { margin: 0; font-size: var(--cds-font-size-heading); font-weight: 600; color: var(--color-ok); }
.hd-report { min-width: 0; display: grid; gap: var(--cds-gap-sm); padding: var(--cds-pad-md) var(--cds-pad-lg); border: 1px solid var(--color-border-line); border-radius: var(--cds-radius); background: var(--color-panel); }
.hd-report[hidden] { display: none; }
.hd-report p { margin: 0; color: var(--color-fg); font-size: var(--cds-font-size-body); font-weight: 500; line-height: 1.7; max-width: 90ch; text-wrap: pretty; }
.hd-sub { margin: var(--cds-gap-sm) 0 0; color: var(--color-fg); font-size: var(--cds-font-size-body); line-height: 1.7; }
.hd-sub .hd-l1, .hd-sub .hd-l2 { display: block; }
@media (min-width: 760px) { .hd-sub .hd-l1 { white-space: nowrap; } }
.hd-sub .hd-ai { font-weight: 800; }
.hd-sub[hidden] { display: none; }
.ask-lead { margin: 0; color: var(--color-fg); line-height: 1.6; }
.ask-box { gap: var(--cds-gap-md); }
.ask-row { display: flex; gap: var(--cds-gap-sm); flex-wrap: wrap; }
.ask-row input { flex: 1 1 18rem; min-width: 0; font: inherit; font-size: var(--cds-font-size-heading); padding: var(--cds-pad-sm) var(--cds-pad-md); border: 1px solid var(--color-border-line); border-radius: var(--cds-radius); background: var(--color-bg); color: var(--color-fg); }
.ask-row input:focus-visible { outline: 2px solid var(--color-fg); outline-offset: 1px; }
.ask-row button { font: inherit; font-weight: 600; padding: var(--cds-pad-sm) var(--cds-pad-lg); border-radius: var(--cds-radius); border: 1px solid var(--color-fg); background: var(--color-fg); color: var(--color-bg); cursor: pointer; }
.ask-ex { display: flex; flex-wrap: wrap; gap: var(--cds-gap-xs); align-items: center; }
.ask-ex-lbl { font-size: var(--cds-font-size-body); font-weight: 700; color: #ffffff; background: #111111; padding: 6px 14px; border-radius: 999px; margin-right: var(--cds-gap-xs); }
.ask-chip { font: inherit; font-size: var(--cds-font-size-caption); padding: 4px 10px; border-radius: 999px; border: 1px solid var(--color-border-line); background: var(--color-bg); color: var(--color-fg); cursor: pointer; }
.ask-chip:hover, .ask-chip:focus-visible { border-color: var(--color-fg); }
.ask-help { margin: 0; color: var(--color-fg-muted); font-size: var(--cds-font-size-caption); line-height: 1.6; }
.ask-out { display: grid; gap: var(--cds-gap-md); }
.ask-hint { margin: 0; color: var(--color-fg-muted); }
.ask-qline { color: var(--color-fg-muted); font-size: var(--cds-font-size-caption); }
.ask-ans { margin: 0; font-size: var(--cds-font-size-heading); font-weight: 600; line-height: 1.55; }
.ask-sub { margin: 0; color: var(--color-fg-muted); font-size: var(--cds-font-size-caption); }
.ask-chips { display: flex; flex-wrap: wrap; gap: var(--cds-gap-xs); }
.ask-tag { font-size: var(--cds-font-size-caption); padding: 2px 8px; border-radius: 6px; background: var(--color-bg); border: 1px solid var(--color-border-line); }
.ask-tag b { color: var(--color-fg-muted); font-weight: 500; }
.ask-det { display: grid; gap: var(--cds-gap-sm); justify-items: start; }
.ask-det > .hw-tablescroll { width: 100%; }
.ask-det-btn { font: inherit; font-size: var(--cds-font-size-body); font-weight: 600; color: var(--color-fg); background: var(--color-bg); border: 1px solid var(--color-border-line); border-radius: var(--cds-radius); padding: var(--cds-pad-xs) var(--cds-pad-md); cursor: pointer; }
.ask-det-btn:hover, .ask-det-btn:focus-visible { border-color: var(--color-fg); }
.ask-table td { white-space: nowrap; }
.hw-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 30rem), 1fr)); gap: var(--cds-gap-md); }
.hw-card { background: var(--color-panel); border: 1px solid var(--color-border-line); border-radius: var(--cds-radius); padding: var(--cds-pad-lg); min-width: 0; display: grid; gap: var(--cds-gap-sm); align-content: start; }
.hw-card.wide { grid-column: 1 / -1; }
.hw-card h2 { margin: 0; font-size: var(--cds-font-size-heading); font-weight: var(--cds-font-weight-medium); }
.hw-note { margin: 0; color: var(--color-fg-muted); font-size: var(--cds-font-size-caption); }
.hw-chart { position: relative; min-height: 280px; }
.hw-chart.short { min-height: 240px; }
.hw-legend { display: flex; flex-wrap: wrap; gap: var(--cds-gap-md); font-size: var(--cds-font-size-caption); color: var(--color-fg-muted); }
.hw-legend span { display: inline-flex; align-items: center; gap: 6px; }
.hw-legend i { width: 10px; height: 10px; border-radius: 3px; display: inline-block; }
.hw-tip { position: absolute; pointer-events: none; background: var(--cds-surface-popover); border: 1px solid var(--cds-border); border-radius: var(--cds-radius); box-shadow: var(--cds-shadow-popover); padding: var(--cds-pad-xs) var(--cds-pad-sm); font-size: var(--cds-font-size-caption); white-space: nowrap; z-index: 2; }
.hw-tip .d { color: var(--cds-text-secondary); margin-bottom: 2px; }
.hw-tip .r { display: flex; align-items: center; gap: 6px; }
.hw-tip .r i { width: 8px; height: 8px; border-radius: 2px; display: inline-block; }
.hw-tip .r b { margin-left: auto; padding-left: var(--cds-gap-md); font-weight: 600; }
.hw-bars { display: grid; gap: 6px; min-height: 240px; align-content: start; }
.hw-bar { display: grid; grid-template-columns: minmax(6rem, 11rem) 1fr auto; gap: var(--cds-gap-sm); align-items: center; font-size: var(--cds-font-size-caption); }
.hw-bar .n { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.hw-bar .t { height: 14px; background: var(--cds-chart-grid); border-radius: 4px; overflow: hidden; }
.hw-bar .t div { height: 100%; border-radius: 4px; }
.hw-bar .v { color: var(--color-fg-muted); min-width: 6.5rem; text-align: right; }
.hw-tools { display: flex; flex-wrap: wrap; gap: var(--cds-gap-sm); align-items: center; justify-content: space-between; }
.hw-tools input, .hw-tools select { font: inherit; padding: var(--cds-pad-xs) var(--cds-pad-sm); border: 1px solid var(--color-border-line); border-radius: var(--cds-radius); background: var(--color-bg); color: var(--color-fg); min-width: 0; }
.hw-tablebox { max-height: 460px; overflow: auto; border-top: 1px solid var(--color-border-line); }
.hw-table { width: 100%; border-collapse: collapse; font-size: var(--cds-font-size-caption); }
.hw-table th { position: sticky; top: 0; background: var(--color-panel); text-align: left; font-weight: 600; color: var(--color-fg-muted); padding: var(--cds-pad-xs) var(--cds-pad-sm); border-bottom: 1px solid var(--color-border-line); white-space: nowrap; }
.hw-table td { padding: var(--cds-pad-xs) var(--cds-pad-sm); border-bottom: 1px solid var(--color-border-line); white-space: nowrap; }
.hw-table td.num, .hw-table th.num { text-align: right; }
.hw-table td.memo { white-space: normal; min-width: 8rem; color: var(--color-fg-muted); }
.hw-pill { display: inline-block; padding: 1px 8px; border-radius: 999px; font-size: var(--cds-font-size-caption); border: 1px solid var(--color-border-line); }
.hw-pill.in { color: var(--color-ok); }
.hw-pill.out { color: var(--color-warn); }
.hw-pill.mv { color: var(--color-fg-muted); }
.hw-checks { margin: 0; padding-left: 1.2em; display: grid; gap: var(--cds-gap-xs); color: var(--color-fg-muted); font-size: var(--cds-font-size-caption); }
.hw-checks b { color: var(--color-fg); font-weight: 600; }
.hw-fail { display: flex; align-items: center; justify-content: center; gap: 8px; min-height: inherit; color: var(--color-fg-muted); font-size: var(--cds-font-size-caption); }
.hw-fail::before { content: ""; width: .375rem; height: .375rem; border-radius: 50%; background: var(--color-bad); }
[data-dash-source-state=empty] { color: transparent; }
[data-dash-source-state=refreshing] { opacity: .5; transition: opacity var(--cds-dur-slow); }
@media (max-width: 640px) { .hw-table .hide-sm { display: none; } }


.gate { min-height: 100vh; display: grid; place-items: center; padding: 24px var(--dash-gutter); }
.gate-box { width: min(100%, 380px); background: var(--color-panel); border: 1px solid var(--color-border-line); border-radius: 14px; padding: 28px 24px; display: grid; gap: 14px; box-shadow: 0 10px 30px rgba(20,30,50,.08); }
.gate-box h1 { margin: 0; font-family: var(--font-anthropic-serif); font-weight: 400; font-size: 24px; line-height: 1.3; word-break: keep-all; }
.gate-box p { margin: 0; color: var(--color-fg-muted); font-size: 14px; line-height: 1.6; word-break: keep-all; }
.gate-box input { font: inherit; font-size: 17px; padding: 12px 14px; border: 1px solid var(--color-border-line); border-radius: 10px; background: var(--color-bg); color: var(--color-fg); width: 100%; }
.gate-box input:focus-visible { outline: 2px solid var(--color-fg); outline-offset: 1px; }
.gate-box button { font: inherit; font-weight: 700; font-size: 16px; padding: 12px; border-radius: 10px; border: 0; background: #111; color: #fff; cursor: pointer; }
.gate-box button:disabled { opacity: .6; cursor: default; }
.gate-err { color: var(--color-bad) !important; min-height: 1.4em; }
</style>
</head>
<body>
<div class="gate" id="gate">
  <div class="gate-box">
    <h1>함안자원 김해공장<br>AI 데이터 자동화</h1>
    <p>임직원 전용 페이지입니다. 비밀번호를 입력해 주세요.</p>
    <input id="gate-pw" type="password" autocomplete="current-password" aria-label="비밀번호" placeholder="비밀번호">
    <button id="gate-go" type="button">열기</button>
    <p class="gate-err" id="gate-err" aria-live="polite"></p>
  </div>
</div>
<div id="app" hidden>
<div class="snap">2026-10-21 기준</div>
<div id="dash-root"></div>
